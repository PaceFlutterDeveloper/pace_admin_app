allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.value(newBuildDir)

subprojects {
    def newSubprojectBuildDir = newBuildDir.dir(project.name)
    project.layout.buildDirectory.value(newSubprojectBuildDir)
}
subprojects {
    project.evaluationDependsOn(":app")
}

// file_picker 11 skips KGP when AGP is 9+, expecting built-in Kotlin.
// This app still opts out of built-in Kotlin because nfc_manager applies KGP.
subprojects { subproject ->
    subproject.pluginManager.withPlugin("com.android.library") {
        if (subproject.name == "file_picker" &&
            !subproject.plugins.hasPlugin("org.jetbrains.kotlin.android")) {
            subproject.apply plugin: "org.jetbrains.kotlin.android"
            subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                compilerOptions.jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}
